name: SonarCloud Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          node-version: 20

      - name: Setup Go
        uses: actions/setup-go@v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          go-version: '1.22'
          cache-dependency-path: 'kernel/go.sum'

      - name: Run JS Tests & Generate Coverage
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        run: |
          npm ci
          npm run test:coverage

      - name: Run Go Tests & Generate Coverage
        run: cd kernel && go test -coverprofile=../coverage.txt ./...

      # SonarCloud Scan with Quality Gate enforcement
      # The -Dsonar.qualitygate.wait=true parameter ensures the workflow waits for
      # Quality Gate results and fails the build if quality standards are not met
      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.go.coverage.reportPaths=coverage.txt
            -Dsonar.qualitygate.wait=true
