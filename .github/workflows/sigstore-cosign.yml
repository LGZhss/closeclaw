name: Sigstore Cosign

on:
  push:
    branches: [ main ]
  release:
    types: [ created ]

permissions:
  contents: read

jobs:
  cosign-install:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # 必须：用于 OIDC 无密钥签名
      contents: write # 必须：用于上传签名或更新 Release

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.1

      - name: Check Cosign Version
        run: cosign version

      # 此处为未来扩展留白：您可以对构建后的二进制文件或镜像执行签名
      # 示例 (无密钥签名):
      # - name: Sign the artifacts
      #   run: |
      #     cosign sign-blob --yes ./dist/closeclaw.exe --output-signature closeclaw.exe.sig
