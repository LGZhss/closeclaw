name: Sigstore Cosign

# 触发条件：仅在发布 Release 时执行签名
# 原因：
# 1. 避免在每次 push 时执行不必要的签名操作，节省 CI/CD 资源
# 2. 签名应该只针对正式发布的版本，而不是开发过程中的每次提交
# 3. 符合 P033 CI/CD 加固要求，确保签名操作的严肃性和可追溯性
on:
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  cosign-install:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      id-token: write # 必须：用于 OIDC 无密钥签名
      contents: write # 必须：用于上传签名或更新 Release

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.1

      - name: Check Cosign Version
        run: cosign version

      # 此处为未来扩展留白：您可以对构建后的二进制文件或镜像执行签名
      # 示例 (无密钥签名):
      # - name: Sign the artifacts
      #   run: |
      #     cosign sign-blob --yes ./dist/closeclaw.exe --output-signature closeclaw.exe.sig
